<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Schematic drawing of a welded heating pipeline with an expansion loop" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="800" fill="#1a2740"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800"/>
  </g>
  <g fill="none" stroke="#e8e9e4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- supply and return lines with U-shaped expansion loop -->
    <path d="M100 520H460V220H740V520H1100"/>
    <path d="M100 580H420V180H780V580H1100"/>
    <!-- pipe supports -->
    <path d="M200 580V630M180 630H220"/>
    <path d="M330 580V630M310 630H350"/>
    <path d="M870 580V630M850 630H890"/>
    <path d="M1000 580V630M980 630H1020"/>
    <!-- weld joints -->
    <path d="M260 505V535M260 565V595"/>
    <path d="M940 505V535M940 565V595"/>
  </g>
  <!-- weld seams highlighted -->
  <g fill="none" stroke="#b4462a" stroke-width="6" stroke-linecap="round">
    <path d="M260 500V540M260 560V600"/>
    <path d="M940 500V540M940 560V600"/>
    <path d="M600 165V195M600 205V235" />
  </g>
  <g fill="none" stroke="#b4462a" stroke-width="3" stroke-dasharray="10 8">
    <circle cx="260" cy="550" r="70"/>
  </g>
  <text x="180" y="720" fill="#e8e9e4" fill-opacity="0.75" font-family="Golos Text, Arial, sans-serif" font-size="30" font-weight="600">T1 / T2</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
