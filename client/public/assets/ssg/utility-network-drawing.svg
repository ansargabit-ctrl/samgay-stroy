<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Schematic cross-section of an external utility network trench with pipes and a manhole" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="800" fill="#1a2740"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800"/>
  </g>
  <g fill="none" stroke="#e8e9e4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground line -->
    <path d="M80 220H330M590 220H1120"/>
    <path d="M100 220l-20 20M140 220l-20 20M180 220l-20 20M220 220l-20 20M260 220l-20 20M300 220l-20 20"/>
    <path d="M640 220l-20 20M680 220l-20 20M720 220l-20 20M1000 220l-20 20M1040 220l-20 20M1080 220l-20 20M1120 220l-20 20"/>
    <!-- trench with sloped walls -->
    <path d="M330 220L380 600H540L590 220"/>
    <!-- sand bedding -->
    <path d="M384 570H536"/>
    <!-- pipes in section -->
    <circle cx="420" cy="530" r="38"/>
    <circle cx="505" cy="545" r="24"/>
    <!-- manhole -->
    <rect x="790" y="300" width="160" height="320"/>
    <path d="M770 300H970"/>
    <path d="M830 220V300M910 220V300"/>
    <path d="M815 214H925"/>
    <!-- ladder rungs -->
    <path d="M820 340H850M820 380H850M820 420H850M820 460H850M820 500H850M820 540H850"/>
    <!-- valve in chamber -->
    <path d="M700 560H790M950 560H1060"/>
    <path d="M860 560H880"/>
    <path d="M880 540L920 580M880 580L920 540"/>
    <path d="M900 560V510M884 510H916"/>
  </g>
  <!-- backfill hint -->
  <path d="M370 470H550M360 400H560M350 330H570" fill="none" stroke="#b4462a" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="180" y="720" fill="#e8e9e4" fill-opacity="0.75" font-family="Golos Text, Arial, sans-serif" font-size="30" font-weight="600">HDPE PE100</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
